<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" href="/styles.css">
    <title>Student Details - School Management</title>
</head>
<body>
    <header>
        <h1><a href="/" class="home-link">School Management Dashboard</a></h1>
    </header>
    <main>
        <div class="content-section" id="student-details-section">
            <h2>Student Details</h2>
            <!-- Button removed, data will load automatically -->
            <p id="student-details-status">Loading student details...</p>
            <div class="table-container">
                <table id="student-details-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Student Name</th>
                            <th>Class</th>
                            <th>Parent Name</th>
                            <th>Parent Email</th>
                            <th>Parent Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="student-details-body">
                        <!-- Student details will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="/scripts.js"></script>
</body>
</html>
