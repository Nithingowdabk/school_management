<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="stylesheet" href="/styles.css">
    <title>Teacher Performance - School Management</title>
</head>
<body>
    <header>
        <h1><a href="/" class="home-link">School Management Dashboard</a></h1>
    </header>
    <main>
        <div class="content-section" id="teacher-performance">
            <h2>Teacher Performance</h2>
            <!-- Button removed, data will load automatically -->
            <p id="performance-result">Loading performance data...</p>
            <div class="table-container">
                <table id="teacher-performance-table"> <!-- Added ID for easier selection -->
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Feedback Score</th>
                            <th>Attendance %</th>
                            <th>Result %</th>
                            <th>Activity Score</th>
                            <th>Final Score</th>
                            <th>Rating</th>
                            <th>AI Suggestion</th>
                        </tr>
                    </thead>
                    <tbody id="teacher-performance-body">
                        <!-- Teacher data will be loaded here -->
                    </tbody>
                </table>
            </div>
            <div id="download-container"></div>
        </div>
    </main>
    <script src="/scripts.js"></script>
</body>
</html>
